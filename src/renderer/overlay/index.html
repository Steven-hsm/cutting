<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
  />
  <title>截图</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <canvas id="mask-canvas"></canvas>

  <div id="edit-wrap" class="hidden">
    <canvas id="edit-canvas"></canvas>
  </div>

  <div id="size-label" class="hidden"></div>

  <div id="toolbar" class="hidden">
    <div class="tb-main">
      <div class="tb-group">
        <button id="btn-text" type="button" class="tb-icon" data-tool="text" title="文字 (T)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 4.2V3.2h8.8v1M8 3.4v9.4M5.8 12.8h4.4"/></svg>
        </button>
        <button id="btn-rect" type="button" class="tb-icon" data-tool="rect" title="矩形 (R)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.6" y="3.6" width="10.8" height="8.8" rx="1.4"/></svg>
        </button>
        <button id="btn-ellipse" type="button" class="tb-icon" data-tool="ellipse" title="椭圆 (O)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.6" ry="4.6"/></svg>
        </button>
        <button id="btn-arrow" type="button" class="tb-icon" data-tool="arrow" title="箭头 (A)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 12.8L12.4 3.6M12.4 3.6H7.4M12.4 3.6v5"/></svg>
        </button>
        <button id="btn-line" type="button" class="tb-icon" data-tool="line" title="直线 (L，Tab 切换箭头)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3"/></svg>
        </button>
        <button id="btn-pen" type="button" class="tb-icon" data-tool="pen" title="画笔 (P，Shift 画直线)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 12.8l.9-2.9 7.2-7.2 2.1 2.1-7.2 7.2-3 0.8zM10 3.9l2.1 2.1"/></svg>
        </button>
        <button id="btn-highlight" type="button" class="tb-icon" data-tool="highlight" title="荧光笔 (H)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.7 10.2l5.1-6.7 2.9 2.2-5.1 6.7-2.9-2.2zM3.2 13.3h8.2"/></svg>
        </button>
        <button id="btn-step" type="button" class="tb-icon" data-tool="step" title="序号 (N)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4"/><path d="M8.2 5.4v5.2M6.7 6.6l1.5-1.2"/></svg>
        </button>
        <button id="btn-mosaic" type="button" class="tb-icon" data-tool="mosaic" title="马赛克 (M)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.8" y="2.8" width="4.2" height="4.2" rx="0.6"/><rect x="9" y="2.8" width="4.2" height="4.2" rx="0.6"/><rect x="2.8" y="9" width="4.2" height="4.2" rx="0.6"/><rect x="9" y="9" width="4.2" height="4.2" rx="0.6"/></svg>
        </button>
        <button id="btn-blur" type="button" class="tb-icon" data-tool="blur" title="高斯模糊 (B)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4"/><path d="M5.2 8.6c1.4-2 4.2-2 5.6 0M5.8 6.2c1.5-1.1 3-1.1 4.4 0"/></svg>
        </button>
      </div>

      <span class="tb-sep"></span>

      <div class="tb-group">
        <button id="btn-undo" type="button" class="tb-icon" title="撤销 (Ctrl+Z)" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 4.4L3.2 7.4l3 3"/><path d="M3.2 7.4h5.6a3.5 3.5 0 010 7"/></svg>
        </button>
        <button id="btn-redo" type="button" class="tb-icon" title="重做 (Ctrl+Y)" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 4.4l3 3-3 3"/><path d="M12.8 7.4H7.2a3.5 3.5 0 000 7"/></svg>
        </button>
      </div>

      <span class="tb-sep"></span>

      <div class="tb-group">
        <button id="btn-ocr" type="button" class="tb-icon" title="识别文字（本地 OCR）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.4V3.2h1.6M11.2 3.2h1.6v1.2M12.8 11.6v1.2h-1.6M4.8 12.8H3.2v-1.2M4.8 6.4h6.4M8 6.4v5M6.6 11.4h2.8"/></svg>
        </button>
        <button id="btn-gif" type="button" class="tb-icon" title="录制 GIF">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="4" width="11.2" height="8" rx="1.4"/><path d="M6.4 6.6h3.2M6.4 9.4h3.2M2.4 8h1.4M12.2 8h1.4"/></svg>
        </button>
        <button id="btn-scroll" type="button" class="tb-icon" title="滚动截图">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4v8M5.2 7.6L8 10.4l2.8-2.8M4 13.2h8"/></svg>
        </button>
        <button id="btn-pin" type="button" class="tb-icon" title="贴到屏幕顶层 (Ctrl+P)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 2.6h3.6l-.4 3.6 1.8 1.8v1H4.8v-1l1.8-1.8-.4-3.6zM8 9v4.4"/></svg>
        </button>
      </div>

      <span class="tb-sep"></span>

      <button id="btn-save" type="button" class="tb-primary" title="保存并复制 (Enter)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.5l3 3 6.2-6.6"/></svg>
        保存
      </button>
      <button id="btn-cancel" type="button" class="tb-icon tb-cancel" title="取消截图 (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>
      </button>
    </div>
  </div>

  <div id="style-panel" class="hidden">
    <div class="sp-row" id="color-group">
      <span class="sp-label">颜色</span>
      <button type="button" class="swatch active" data-color="#ff3b30" style="--swatch:#ff3b30" title="红"></button>
      <button type="button" class="swatch" data-color="#ffcc00" style="--swatch:#ffcc00" title="黄"></button>
      <button type="button" class="swatch" data-color="#34c759" style="--swatch:#34c759" title="绿"></button>
      <button type="button" class="swatch" data-color="#2f80ed" style="--swatch:#2f80ed" title="蓝"></button>
      <button type="button" class="swatch" data-color="#ffffff" style="--swatch:#ffffff" title="白"></button>
      <label class="swatch-custom" title="自定义颜色">
        <input type="color" id="custom-color" value="#ff3b30" />
        <span></span>
      </label>
    </div>

    <div class="sp-row seg-group hidden" id="seg-shape">
      <span class="sp-label">粗细</span>
      <button type="button" class="seg" data-width="2" title="细">细</button>
      <button type="button" class="seg active" data-width="3" title="中">中</button>
      <button type="button" class="seg" data-width="6" title="粗">粗</button>
    </div>

    <div class="sp-row seg-group hidden" id="seg-text">
      <span class="sp-label">字号</span>
      <button type="button" class="seg" data-font="14">小</button>
      <button type="button" class="seg active" data-font="18">中</button>
      <button type="button" class="seg" data-font="26">大</button>
    </div>

    <div class="sp-row seg-group hidden" id="seg-brush">
      <span class="sp-label">笔刷</span>
      <button type="button" class="seg" data-brush="12">细</button>
      <button type="button" class="seg active" data-brush="24">中</button>
      <button type="button" class="seg" data-brush="40">粗</button>
    </div>

    <div class="sp-row seg-group hidden" id="seg-blur">
      <span class="sp-label">强度</span>
      <button type="button" class="seg" data-blur="6">弱</button>
      <button type="button" class="seg active" data-blur="12">中</button>
      <button type="button" class="seg" data-blur="24">强</button>
    </div>
  </div>

  <textarea id="textbox" class="hidden" spellcheck="false" placeholder="输入文字 · Ctrl+Enter 完成 · Esc 取消"></textarea>

  <div id="ocr-layer" class="hidden"></div>

  <div id="ocr-actions" class="hidden">
    <span id="ocr-count"></span>
    <button id="ocr-copy-all" type="button">复制全部</button>
    <button id="ocr-exit" type="button">退出识图</button>
  </div>

  <div id="hint">拖动选择区域 · Alt 放大镜 · Esc 取消</div>
  <div id="toast" class="hidden"></div>

  <div id="picker" class="hidden">
    <canvas id="picker-canvas"></canvas>
    <div id="picker-color">
      <span id="picker-swatch"></span>
      <span id="picker-hex">#000000</span>
      <span id="picker-format">HEX</span>
    </div>
    <div id="picker-tip">C 复制 · Shift 切换格式 · Alt 隐藏</div>
  </div>

  <script src="mosaic.js"></script>
  <script src="beautify.js"></script>
  <script src="picker.js"></script>
  <script src="textLayer.js"></script>
  <script src="editor.js"></script>
  <script src="textbox.js"></script>
  <script src="selection.js"></script>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
